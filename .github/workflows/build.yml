name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Download MediaPipe models (pose landmarker + selfie segmenter)
        run: |
          mkdir -p app/src/main/assets/models
          curl -L -o app/src/main/assets/models/pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task
          curl -L -o app/src/main/assets/models/selfie_multiclass_256x256.tflite \
            https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite
          ls -la app/src/main/assets/models

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Prizrak APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prizrak-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Bahrom Taxi APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bahromtaxi-debug-apk
          path: taxiapp/build/outputs/apk/debug/taxiapp-debug.apk
